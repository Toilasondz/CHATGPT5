
name: Build H SON Independent v3

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install ldid dpkg make
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Install Theos and SDK
        shell: bash
        run: |
          set -euo pipefail
          THEOS="$HOME/theos"

          if [ -d "$THEOS/.git" ]; then
            git -C "$THEOS" submodule update --init --recursive
          else
            if [ -e "$THEOS" ]; then
              rm -rf "$THEOS"
            fi
            git clone --recursive https://github.com/theos/theos.git "$THEOS"
          fi

          mkdir -p "$THEOS/sdks"

          if ! find "$THEOS/sdks" -mindepth 1 -maxdepth 1 -type d -name '*.sdk' -print -quit | grep -q .; then
            TEMP_SDK="$RUNNER_TEMP/theos-sdks"
            rm -rf "$TEMP_SDK"
            git clone --depth 1 https://github.com/theos/sdks.git "$TEMP_SDK"
            cp -R "$TEMP_SDK"/. "$THEOS/sdks"/
          fi

          SDK_FOUND="$(find "$THEOS/sdks" -mindepth 1 -maxdepth 1 -type d -name '*.sdk' -print -quit)"
          test -n "$SDK_FOUND"

          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: Fix and verify source
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/fix-tab-loop-signedness.py
          python3 scripts/verify-feature-map.py

          grep -nE 'for \(NSUInteger i = 0; i < tabTitles\.count; i\+\+\)' Source/Tweak.m

          if grep -n 'editor\.viewIfLoaded' Source/Features/HSONReplaceLayer.m; then
            echo "Stale viewIfLoaded error found"
            exit 1
          fi

      - name: Build H SON
        shell: bash
        run: |
          set -euo pipefail

          make --version
          make clean
          make package FINALPACKAGE=1

      - name: Collect build files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release

          DYLIB="$(find .theos/obj -type f -name 'HSONModernMenu.dylib' -print -quit)"
          test -n "$DYLIB"
          cp "$DYLIB" release/

          DEB="$(find packages -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$DEB"
          cp "$DEB" release/

          lipo -info release/HSONModernMenu.dylib
          ls -lh release/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HSONModernMenu-arm64
          path: release/*
          if-no-files-found: error
